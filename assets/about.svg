<svg xmlns="http://www.w3.org/2000/svg" width="860" height="288" viewBox="0 0 860 288" role="img" aria-label="Full-stack engineer building AI agents, voice AI and product-grade web apps, mostly in TypeScript and Python. Open source contributor to Jitsi Meet, OpenStreetMap (iD) and Accord Project. Hackathon Winner. SheFi Scholar, Season 13.">
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; fill: #CDD6F4; }
    .m { fill: #CBA6F7; } .pk { fill: #F5C2E7; } .b { fill: #89B4FA; } .d { fill: #6C7086; }
    .sub { fill: #A6ADC8; } .bold { font-weight: 700; } .it { font-style: italic; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
  </style>
  <rect x="1" y="1" width="858" height="286" rx="12" fill="#1E1E2E" stroke="#45475A"/>
  <path d="M1,13 a12,12 0 0 1 12,-12 h834 a12,12 0 0 1 12,12 v18 h-858 Z" fill="#181825"/>
  <circle cx="22" cy="16" r="5" fill="#F38BA8"/><circle cx="38" cy="16" r="5" fill="#F9E2AF"/><circle cx="54" cy="16" r="5" fill="#A6E3A1"/>
  
  <text x="28" y="58" font-size="15" xml:space="preserve">Full-stack engineer building <tspan class="m bold">AI agents, voice AI and product-grade web apps</tspan>,</text>
  <text x="28" y="83" font-size="15" xml:space="preserve">mostly in <tspan class="b bold">TypeScript</tspan> and <tspan class="b bold">Python</tspan>.</text>
  <text x="28" y="120" font-size="15" xml:space="preserve"><tspan class="pk bold">  &gt; </tspan><tspan class="m bold">Open source contributor</tspan>: Jitsi Meet, OpenStreetMap (iD) and Accord Project</text>
  <text x="28" y="145" font-size="15" xml:space="preserve"><tspan class="pk bold">  &gt; </tspan><tspan class="m bold">AI agents and voice AI</tspan>: tool-using LLM agents, MCP servers, real-time voice apps</text>
  <text x="28" y="170" font-size="15" xml:space="preserve"><tspan class="pk bold">  &gt; </tspan><tspan class="m bold">Full-stack products</tspan>: Next.js, Node, FastAPI, Postgres</text>
  <text x="28" y="195" font-size="15" xml:space="preserve"><tspan class="pk bold">  &gt; </tspan><tspan class="m bold">Applied ML</tspan>: model drift, entity resolution, anomaly detection</text>
  <text x="28" y="220" font-size="15" xml:space="preserve"><tspan class="pk bold">  &gt; </tspan><tspan class="m bold">Recognition</tspan>: Hackathon Winner, SheFi Scholar (Season 13)</text>
  <text x="28" y="257" font-size="15" xml:space="preserve"><tspan class="d it"># "I always know how to find the answer, and I will." (The Pursuit of Happiness)</tspan></text>
</svg>
