  <style>
    .bounce   { animation: bounce 1.2s steps(1) infinite; }
    @keyframes bounce { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .l-open   { animation: lOpen 4s steps(1) infinite; }
    .r-open   { animation: rOpen 4s steps(1) infinite; }
    .l-closed { opacity: 0; animation: lClosed 4s steps(1) infinite; }
    .r-closed { opacity: 0; animation: rClosed 4s steps(1) infinite; }
    .mouth    { animation: mouth 4s steps(1) infinite; }
    .fx       { opacity: 0; animation: fx 4s steps(1) infinite; }
    @keyframes lOpen   { 0% { opacity: 1; } 15% { opacity: 0; } 19% { opacity: 1; } }
    @keyframes rOpen   { 0% { opacity: 1; } 15% { opacity: 0; } 19% { opacity: 1; } 50% { opacity: 0; } 82% { opacity: 1; } }
    @keyframes lClosed { 0% { opacity: 0; } 15% { opacity: 1; } 19% { opacity: 0; } }
    @keyframes rClosed { 0% { opacity: 0; } 15% { opacity: 1; } 19% { opacity: 0; } 50% { opacity: 1; } 82% { opacity: 0; } }
    @keyframes mouth   { 0% { opacity: 1; } 50% { opacity: 0; } 82% { opacity: 1; } }
    @keyframes fx      { 0% { opacity: 0; } 50% { opacity: 1; } 82% { opacity: 0; } }</style>
